[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
# size over speed: rent is paid per byte, and nothing here is compute-bound
opt-level = "z"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
